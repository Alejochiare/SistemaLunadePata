     TOAST CONTAINER
============================================= -->
<div class="toast-container" id="toast-container"></div>


<!-- =============================================
     SCRIPTS
============================================= -->
<script>
  window.UI = {
    mostrarToast(mensaje, tipo = 'default') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${tipo}`;
      toast.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          ${tipo === 'success' ? '<polyline points="20 6 9 17 4 12"/>' :
            tipo === 'danger'  ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' :
            '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
        </svg>
        <span>${mensaje}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-exit');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, 3000);
    }
  };
</script>

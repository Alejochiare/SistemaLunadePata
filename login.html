<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Luna de Plata</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">

  <!-- Redirigir si ya hay sesión activa -->
  <script src="js/revendedoras/storage.js"></script>
  <script>
    (function () {
      try {
        var s = JSON.parse(sessionStorage.getItem('ldp_session'));
        if (s && s.role === 'admin')            window.location.replace('revendedoras.html');
        else if (s && s.role === 'revendedora') window.location.replace('mi-cuenta.html');
        else if (s && s.role === 'sucursal')    window.location.replace('sucursal-portal.html');
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-page">

<div class="login-wrapper">

  <div class="login-brand">
    <div class="login-brand-name">Luna de Plata</div>
    <div class="login-brand-sub">Sistema de gestión</div>
  </div>

  <div class="login-card">
    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Ingresá con tu usuario y contraseña</p>

    <form class="login-form" id="form-login" novalidate>

      <div id="login-error" class="login-error" role="alert"></div>

      <div class="login-field">
        <label class="login-label" for="login-username">Usuario</label>
        <input
          type="text"
          class="login-input"
          id="login-username"
          placeholder="Tu nombre de usuario"
          autocomplete="username"
          autofocus
          required
        >
      </div>

      <div class="login-field">
        <label class="login-label" for="login-password">Contraseña</label>
        <input
          type="password"
          class="login-input"
          id="login-password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="login-btn" id="btn-login">
        Ingresar
      </button>

    </form>
  </div>

  <div class="login-footer">v1.0 · Luna de Plata</div>
</div>


<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    window.Auth.inicializar();

    const form     = document.getElementById('form-login');
    const errorEl  = document.getElementById('login-error');
    const btnLogin = document.getElementById('btn-login');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      errorEl.textContent = '';
      errorEl.classList.remove('visible');
      btnLogin.disabled = true;
      btnLogin.textContent = 'Ingresando...';

      const result = window.Auth.login(username, password);

      if (result.success) {
        if (result.role === 'admin') {
          window.location.href = 'revendedoras.html';
        } else if (result.role === 'sucursal') {
          window.location.href = 'sucursal-portal.html';
        } else {
          window.location.href = 'mi-cuenta.html';
        }
      } else {
        errorEl.textContent = result.error;
        errorEl.classList.add('visible');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Ingresar';
        document.getElementById('login-password').value = '';
        document.getElementById('login-username').focus();
      }
    });
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Luna de Plata</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <style>
    body.login-page { background: #111110; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; color: #f5f5f5; }
    .login-wrapper { width: 100%; max-width: 420px; }
    .login-card { background: #111110; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 32px; box-shadow: 0 32px 80px rgba(0,0,0,0.25); }
    .login-brand-img { display: block; width: 220px; max-width: 100%; margin: 0 auto; }
    .login-brand-sub { color: #c8a96e; text-align: center; margin-top: 10px; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; }
    .login-title { font-size: 28px; color: #fff; margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; color: #b8b8b4; margin-bottom: 24px; }
    .login-field { margin-bottom: 18px; }
    .login-label { display: block; margin-bottom: 8px; color: #d4d4d2; font-size: 13px; }
    .login-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #fff; }
    .login-input::placeholder { color: rgba(255,255,255,0.55); }
    .login-btn { width: 100%; padding: 12px 16px; margin-top: 8px; border-radius: 12px; background: #c8a96e; color: #111110; font-weight: 700; cursor: pointer; border: none; }
    .login-btn:hover { opacity: 0.95; }
    .login-footer { text-align: center; margin-top: 26px; color: rgba(255,255,255,0.45); font-size: 12px; }
    .login-error { display: none; }
    .login-error.visible { display: block; margin-bottom: 16px; }
  </style>

  <!-- Redirigir si ya hay sesión activa -->
  <script src="js/revendedoras/storage.js"></script>
  <script>
    (function () {
      try {
        var s = JSON.parse(sessionStorage.getItem('ldp_session'));
        if (s && s.role === 'admin')            window.location.replace('revendedoras.html');
        else if (s && s.role === 'revendedora') window.location.replace('mi-cuenta.html');
        else if (s && s.role === 'sucursal')    window.location.replace('sucursal-portal.html');
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-page">

<div class="login-wrapper">

  <div class="login-brand">
    <img src="img/logo-cream.png" alt="Luna de Plata" class="login-brand-img">
    <div class="login-brand-sub">Sistema de gestión</div>
  </div>

  <div class="login-card">
    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Ingresá con tu usuario y contraseña</p>

    <form class="login-form" id="form-login" novalidate>

      <div id="login-error" class="login-error" role="alert"></div>

      <div class="login-field">
        <label class="login-label" for="login-username">Usuario</label>
        <input
          type="text"
          class="login-input"
          id="login-username"
          placeholder="Tu nombre de usuario"
          autocomplete="username"
          autofocus
          required
        >
      </div>

      <div class="login-field">
        <label class="login-label" for="login-password">Contraseña</label>
        <input
          type="password"
          class="login-input"
          id="login-password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="login-btn" id="btn-login">
        Ingresar
      </button>

    </form>
  </div>

  <div class="login-footer">v1.0 · Luna de Plata</div>
</div>


<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    window.Auth.inicializar();

    const form     = document.getElementById('form-login');
    const errorEl  = document.getElementById('login-error');
    const btnLogin = document.getElementById('btn-login');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      errorEl.textContent = '';
      errorEl.classList.remove('visible');
      btnLogin.disabled = true;
      btnLogin.textContent = 'Ingresando...';

      const result = window.Auth.login(username, password);

      if (result.success) {
        if (result.role === 'admin') {
          window.location.href = 'revendedoras.html';
        } else if (result.role === 'sucursal') {
          window.location.href = 'sucursal-portal.html';
        } else {
          window.location.href = 'mi-cuenta.html';
        }
      } else {
        errorEl.textContent = result.error;
        errorEl.classList.add('visible');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Ingresar';
        document.getElementById('login-password').value = '';
        document.getElementById('login-username').focus();
      }
    });
  });
</script>

</body>
</html>

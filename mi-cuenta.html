<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta — Luna de Plata</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/revendedoras.css">
  <link rel="stylesheet" href="css/panos.css">
  <link rel="stylesheet" href="css/mi-cuenta.css">

  <!-- Guard: redirigir si no hay sesión de revendedora -->
  <script src="js/revendedoras/storage.js"></script>
  <script>
    (function () {
      try {
        var s = JSON.parse(sessionStorage.getItem('ldp_session'));
        if (!s)                      { window.location.replace('login.html');        }
        else if (s.role === 'admin') { window.location.replace('revendedoras.html'); }
      } catch (e) { window.location.replace('login.html'); }
    })();
  </script>
</head>
<body>

<div class="app-layout">

  <!-- =============================================
       SIDEBAR
  ============================================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">Luna de Plata</div>
      <div class="sidebar-logo-sub">Mi portal</div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Navegación</div>

      <a href="#mc-perfil-section" class="sidebar-nav-item active">
        <svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Mi cuenta
      </a>

      <a href="#mc-panos-section" class="sidebar-nav-item">
        <svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
        </svg>
        Mis paños
      </a>

      <a href="#mc-liq-section" class="sidebar-nav-item">
        <svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        Liquidaciones
      </a>
    </nav>

    <!-- El footer es inyectado por auth.js (usuario + logout) -->
    <div class="sidebar-footer"></div>
  </aside>


  <!-- =============================================
       MAIN
  ============================================= -->
  <main class="main-content">

    <header class="page-header">
      <div class="page-header-breadcrumb">
        <span>Luna de Plata</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        <span id="mc-header-nombre">Mi cuenta</span>
      </div>
    </header>

    <div class="page-body">

      <!-- PERFIL -->
      <section class="mc-section" id="mc-perfil-section">
        <h2 class="mc-section-title">Mi cuenta</h2>
        <div id="mc-perfil"><!-- renderizado por JS --></div>
      </section>

      <!-- PAÑOS -->
      <section class="mc-section" id="mc-panos-section">
        <h2 class="mc-section-title">Mis paños</h2>
        <div class="mc-panos-lista" id="mc-panos-lista"><!-- renderizado por JS --></div>
      </section>

      <!-- LIQUIDACIONES -->
      <section class="mc-section" id="mc-liq-section">
        <h2 class="mc-section-title">Mis movimientos</h2>
        <div id="mc-liquidaciones-lista"><!-- renderizado por JS --></div>
      </section>

    </div><!-- /page-body -->
  </main>

</div><!-- /app-layout -->


<!-- =============================================
     TOAST CONTAINER
============================================= -->
<div class="toast-container" id="toast-container"></div>


<!-- =============================================
     SCRIPTS
============================================= -->
<script>
  window.UI = {
    mostrarToast(mensaje, tipo = 'default') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${tipo}`;
      toast.innerHTML = `<span>${mensaje}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-exit');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, 3000);
    }
  };
</script>

<script src="js/revendedoras/calculos.js"></script>
<script src="js/auth.js"></script>
<script src="js/mi-cuenta/mi-cuenta-page.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    window.Auth.inicializar();
    window.Auth.inyectarSidebar();

    const sesion = window.Auth.obtenerSesion();
    if (sesion) {
      const headerNombre = document.getElementById('mc-header-nombre');
      if (headerNombre) headerNombre.textContent = sesion.nombre;
    }

    window.MiCuenta.inicializar();
  });
</script>

</body>
</html>
